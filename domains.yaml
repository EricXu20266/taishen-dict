# domains.yaml — 领域配置

# 格式说明：
#   name: 领域英文标识（输出文件名 name.txt）
#   display: 中文展示名
#   wiki_categories: 维基百科分类列表（中文维基 Category: 前缀）
#   max_depth: 子分类递归深度（0=仅本分类, 2=两层子分类）

domains:
  computer:
    display: "计算机"
    wiki_categories:
      - Category:计算机科学
      - Category:软件
    max_depth: 2

